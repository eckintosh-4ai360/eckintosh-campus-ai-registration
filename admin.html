<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a43"><title>Registration admin | Eckintosh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&amp;display=swap"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/admin.js" defer></script></head>
<body class="admin-page"><header class="site-header"><a class="brand" href="/"><img class="admin-logo" src="/public/logo.png" alt=""><span>ECKINTOSH<span class="brand-sub">TECHNOLOGIES</span></span></a><a class="header-link" href="/">View registration page ↗</a></header>
<main class="admin-shell"><section class="admin-login" id="login-view" hidden><span class="kicker">ECKINTOSH AI CAMPUS PROGRAMME</span><h1>Admin sign in.</h1><p class="muted">Sign in to manage registrations and payments.</p><form id="login-form"><div class="field"><label for="admin-email">Email address</label><input id="admin-email" name="email" type="text" autocomplete="username" required></div><div class="field"><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required></div><p class="admin-error" id="login-error" role="alert" hidden></p><button class="primary" type="submit">Sign in <span aria-hidden="true">→</span></button></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><span class="kicker">ECKINTOSH AI CAMPUS PROGRAMME</span><h1>Registrations.</h1><p class="muted">View participants and update payment status.</p></div><button id="logout" type="button" class="secondary">Sign out</button></div><div class="admin-toolbar"><div><strong id="registration-count">0 registrations</strong><p class="muted">Payment confirmation is done manually.</p></div><form id="search-form"><label class="visually-hidden" for="search">Search registrations</label><input id="search" type="search" maxlength="100" placeholder="Search name, phone or reference"><button class="secondary" type="submit">Search</button></form></div><p id="dashboard-error" class="admin-error" role="alert" hidden></p><div id="registration-list" class="registration-list" aria-live="polite"></div><div class="pagination"><button id="previous" class="secondary" type="button">← Previous</button><span id="page-info"></span><button id="next" class="secondary" type="button">Next →</button></div></section></main></body></html>
